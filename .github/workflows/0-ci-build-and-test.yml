name: 0 - CI Build & Test

# Build + unit-test gate for pushes and PRs. The repo previously had only the
# signed-release workflows (1/2/3-*), so nothing compiled or tested changes on a
# PR before merge. This adds that missing feedback loop without needing any
# signing secrets (debug build only).
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Queue newer runs instead of canceling active ones so CI statuses are stable.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect Settings UI changes
    runs-on: ubuntu-latest
    outputs:
      settings_ui: ${{ steps.filter.outputs.settings_ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Settings UI changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            settings_ui:
              - 'app/src/main/java/com/hermeswebui/android/ui/settings/**'
              - 'app/src/androidTest/java/com/hermeswebui/android/ui/settings/**'
              - 'app/src/main/res/values/**'
              - 'app/build.gradle.kts'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/0-ci-build-and-test.yml'

  build:
    name: Unit tests + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "Android SDK manager is unavailable"; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hermes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  settings-ui-smoke:
    name: Settings UI instrumentation smoke
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.settings_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "Android SDK manager is unavailable"; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Run focused Settings screen instrumentation
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hermeswebui.android.ui.settings.SettingsScreenTest
