name: Play Store Beta (Manual)

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Play AAB artifact name from the orchestration build run.
        required: true
        type: string
      build_run_id:
        description: GitHub Actions run ID that created the AAB artifact.
        required: true
        type: string
      commit_sha:
        description: Commit SHA used by the build run.
        required: true
        type: string
      tag_name:
        description: Release tag, such as v1.1.0.
        required: true
        type: string
      version_name:
        description: Android versionName, such as 1.1.0.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  publish-play-beta:
    name: Play Store Beta (Manual)
    uses: ./.github/workflows/_publish-play-store.yml
    permissions:
      contents: read
      actions: read
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
    with:
      artifact_name: ${{ inputs.artifact_name }}
      build_run_id: ${{ inputs.build_run_id }}
      commit_sha: ${{ inputs.commit_sha }}
      tag_name: ${{ inputs.tag_name }}
      version_name: ${{ inputs.version_name }}
      track: beta
