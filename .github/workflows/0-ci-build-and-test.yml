name: 0 - CI Build & Test

# Build + quality gate for pushes and PRs. Every check runs as its own job so a
# red X names the thing that broke (unit tests vs. Android Lint vs. injected-JS
# syntax) instead of collapsing several gates into one opaque failure.
#
# A documentation-only change set skips the three Gradle jobs, which have nothing
# to compile. Release tooling tests still run because they assert the README
# release metadata matches Gradle.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request supersedes its older run, so cancel that one. Runs on main keep
  # queuing instead, so every merged commit gets a complete, stable set of statuses.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android_app: ${{ steps.filter.outputs.android_app }}
      docs: ${{ steps.filter.outputs.docs }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the docs-only detector can diff against the base.
          fetch-depth: 0

      - name: Detect Android app changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android_app:
              - 'app/src/**'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradle/libs.versions.toml'
              - '.github/workflows/0-ci-build-and-test.yml'
            docs:
              - '**/*.md'

      - name: Detect docs-only change set
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          docs_only="$(python3 tools/detect_docs_only.py)"
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Not a Markdown style linter. `docs-render` blocks only on breaks that render
  # as literal garbage or point at a file that does not exist; `docs-links`
  # checks external URLs and stays informational because the network is not a
  # build dependency.
  docs-render:
    name: Docs - Markdown rendering and in-repo links
    # Unconditional: it checks the whole tree in seconds, and a required status
    # check must never be skipped or it reports as pending forever.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown rendering and in-repo links
        run: python3 tools/check_markdown.py

  docs-links:
    name: Docs - external links (informational)
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Handed a fixed glob rather than a list built from changed filenames, so
      # no attacker-controlled name from a fork PR reaches the action's shell.
      - name: Broken-link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        continue-on-error: true
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302,303,307,308,401,403,429
            --timeout 20
            --max-retries 2
            --exclude-path build
            --exclude-path node_modules
            "**/*.md"
          fail: true

  release-tooling-tests:
    name: Release tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run release tooling unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

  # The WebUI shims live inside Kotlin raw strings, so kotlinc and Android Lint
  # never parse them. A syntax error or a runtime-only mistake there ships a
  # green build that bricks WebUI rendering on device. These two jobs extract the
  # scripts and check them as real JavaScript.
  webui-script-syntax:
    name: Injected WebUI JS - syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract injected WebUI scripts
        run: python3 tools/extract_webui_scripts.py

      - name: Syntax-check each injected script
        run: |
          set -uo pipefail
          failed=0
          for script in build/webui-scripts/*.js; do
            if node --check "$script"; then
              echo "ok: $script"
            else
              echo "::error file=$script::Injected WebUI script failed to parse"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload extracted scripts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-webui-extracted-scripts
          path: build/webui-scripts/
          if-no-files-found: warn

  webui-script-lint:
    name: Injected WebUI JS - runtime guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract injected WebUI scripts
        run: python3 tools/extract_webui_scripts.py

      - name: Install ESLint
        run: npm install --no-save --no-audit --no-fund eslint@^10

      - name: ESLint runtime-error gate
        run: npx eslint --no-config-lookup -c eslint.runtime-guard.config.mjs "build/webui-scripts/**/*.js"

  unit-tests:
    name: Unit tests
    needs: changes
    # These three jobs always run so they can safely be required status checks:
    # a *skipped* required check reports as pending forever and wedges the PR.
    # A docs-only change set short-circuits the steps instead, so the check still
    # reports a conclusion within seconds. An empty docs_only (which is what a
    # failed `changes` job yields) is treated as "not docs-only", so a detector
    # failure degrades to running the full gate.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only short-circuit
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change set - nothing to compile or test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'

      - name: Set up JDK 17
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: needs.changes.outputs.docs_only != 'true'
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Run unit tests
        if: needs.changes.outputs.docs_only != 'true'
        # Full discovery includes voice ownership, microphone permission lifecycle,
        # and selected-server policies.
        # tools/tests/test_pr_regression_workflow.py guards against narrowing this suite.
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload unit test reports
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  android-lint:
    name: Android Lint
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only short-circuit
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change set - nothing to lint."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'

      - name: Set up JDK 17
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: needs.changes.outputs.docs_only != 'true'
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Run Android Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  debug-build:
    name: Debug APK build
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs-only short-circuit
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change set - nothing to build."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'

      - name: Set up JDK 17
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "Android SDK manager is unavailable"; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail

      - name: Set up Gradle
        if: needs.changes.outputs.docs_only != 'true'
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Assemble debug APK
        if: needs.changes.outputs.docs_only != 'true'
        run: ./gradlew --no-daemon assembleDebug

      # F-Droid builds `assembleRelease` from each release tag without signing keys.
      # Prove that exact unsigned build works and that only the Play build links Play Core.
      - name: Verify F-Droid release build and Play-free dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: ./gradlew --no-daemon verifyFossDependencies compilePlayKotlin assembleRelease

      - name: Upload debug APK
        if: ${{ success() && needs.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  android-ui-smoke:
    name: Android instrumentation (API ${{ matrix.api-level }})
    needs: changes
    # Always runs (same docs-only pattern as the Gradle jobs above): a job-level skip would leave
    # the check pending forever if it were ever made required. When no Android source or build
    # input changed, the steps short-circuit instead. An empty android_app (a failed `changes` job)
    # is treated as "changed", so a detector failure degrades to running the full suite.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - name: No-Android-change short-circuit
        if: needs.changes.outputs.android_app == 'false'
        run: echo "No Android source or build input changed - emulator suite not needed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.android_app != 'false'

      - name: Set up JDK 17
        if: needs.changes.outputs.android_app != 'false'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        if: needs.changes.outputs.android_app != 'false'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "Android SDK manager is unavailable"; exit 1; }
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail

      - name: Set up Gradle
        if: needs.changes.outputs.android_app != 'false'
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Enable KVM
        if: needs.changes.outputs.android_app != 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        if: needs.changes.outputs.android_app != 'false'
        # Keep unfiltered: includes encrypted selected-server persistence/navigation
        # and Android WebView/service regressions, not upstream WebUI voice behavior.
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: ${{ always() && needs.changes.outputs.android_app != 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-android-tests-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  # One stable status name for the branch ruleset (Issues #105, #156), so matrix job names such as
  # "Android instrumentation (API 36)" never have to be listed there. It always reports. It passes
  # only when every gating job succeeded or was legitimately skipped (the emulator matrix short-circuits
  # its steps when no Android files changed). A failed or cancelled job fails it. docs-links is informational
  # and deliberately not part of the gate.
  ci-gate:
    name: CI gate
    needs:
      - changes
      - docs-render
      - release-tooling-tests
      - webui-script-syntax
      - webui-script-lint
      - unit-tests
      - android-lint
      - debug-build
      - android-ui-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gating job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          for name, job in sorted(needs.items()):
              print(f"{name}: {job['result']}")
          bad = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          if bad:
              print(f"Failing gates: {bad}")
              sys.exit(1)
          PY
