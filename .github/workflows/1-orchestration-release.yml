name: 1 - Orchestration Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-artifacts:
    name: 1 - Build Release Artifacts
    runs-on: ubuntu-latest

    outputs:
      version_name: ${{ steps.release_version.outputs.version_name }}
      tag_name: ${{ steps.release_version.outputs.tag_name }}
      commit_sha: ${{ steps.release_commit.outputs.commit_sha }}
      github_apk_artifact_name: ${{ steps.artifact_names.outputs.github_apk_artifact_name }}
      play_aab_artifact_name: ${{ steps.artifact_names.outputs.play_aab_artifact_name }}

    env:
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/signing/upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.0

      - name: Validate release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "Manual production releases must run from main, not $GITHUB_REF."
            exit 1
          fi

      - name: Validate release secrets
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}" || { echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64"; exit 1; }

      - name: Decode release keystore
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/signing"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -f "$ANDROID_KEYSTORE_FILE" || { echo "Keystore file was not created"; exit 1; }
          echo "Keystore file size: $(wc -c < "$ANDROID_KEYSTORE_FILE") bytes"

      - name: Read Android release version
        id: release_version
        shell: bash
        run: |
          chmod +x ./gradlew
          version_name="$(./gradlew -q :app:printReleaseVersionName)"
          test -n "$version_name" || { echo "Gradle returned an empty versionName"; exit 1; }
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version_name" >> "$GITHUB_OUTPUT"
          echo "Android versionName: $version_name"

      - name: Validate release version is unpublished
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_name="${{ steps.release_version.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" >/dev/null 2>&1; then
            echo "Tag $tag_name already exists. Use the target-specific retry workflows instead."
            exit 1
          fi
          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag_name already exists. Use the target-specific retry workflows instead."
            exit 1
          fi

      - name: Validate release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected_tag="${{ steps.release_version.outputs.tag_name }}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match Android versionName ${{ steps.release_version.outputs.version_name }}."
            echo "Update app/build.gradle.kts or push tag $expected_tag."
            exit 1
          fi

      - name: Read release commit
        id: release_commit
        shell: bash
        run: |
          commit_sha="$(git rev-parse HEAD)"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: $commit_sha"

      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Generate release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag_name }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.commit_sha }}
        run: |
          mkdir -p build/release/play-whatsnew
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            --jq '.body' > build/release/generated-notes.md
          python3 tools/generate_release_metadata.py \
            --input-file build/release/generated-notes.md \
            --github-output build/release/release-notes.md \
            --play-output build/release/play-whatsnew/whatsnew-en-US
          test -s build/release/release-notes.md || { echo "GitHub release notes are empty"; exit 1; }
          test -s build/release/play-whatsnew/whatsnew-en-US || { echo "Play What's New is empty"; exit 1; }
          play_chars="$(python3 -c 'from pathlib import Path; print(len(Path("build/release/play-whatsnew/whatsnew-en-US").read_text(encoding="utf-8").rstrip("\n")))')"
          test "$play_chars" -le 480 || { echo "Play What's New exceeds 480 characters"; exit 1; }
          tail -n 1 build/release/play-whatsnew/whatsnew-en-US | \
            grep -Fx 'Report issues through the in-app bug report tool.' >/dev/null || {
              echo "Play What's New is missing the required support line"
              exit 1
            }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Build signed release artifacts
        shell: bash
        run: |
          ./gradlew test lintDebug :app:stageGithubReleaseApk :app:bundleRelease --no-daemon

          src_aab="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$src_aab" || { echo "No release AAB found"; exit 1; }
          cp "$src_aab" "build/release/hermes-webui-v${{ steps.release_version.outputs.version_name }}.aab"

          find build/release -maxdepth 1 -type f -name '*.apk' -print
          find build/release -maxdepth 1 -type f -name '*.aab' -print

      - name: Validate staged release artifacts
        shell: bash
        run: |
          expected_apk="build/release/hermes-webui-v${{ steps.release_version.outputs.version_name }}-github.apk"
          expected_aab="build/release/hermes-webui-v${{ steps.release_version.outputs.version_name }}.aab"
          apk_count="$(find build/release -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          aab_count="$(find build/release -maxdepth 1 -type f -name '*.aab' | wc -l | tr -d ' ')"

          if [ "$apk_count" != "1" ]; then
            echo "Expected exactly one GitHub APK artifact, found $apk_count."
            find build/release -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          fi

          if [ "$aab_count" != "1" ]; then
            echo "Expected exactly one Play AAB artifact, found $aab_count."
            find build/release -maxdepth 1 -type f -name '*.aab' -print
            exit 1
          fi
          test -f "$expected_apk" || { echo "Missing expected APK: $expected_apk"; exit 1; }
          test -f "$expected_aab" || { echo "Missing expected AAB: $expected_aab"; exit 1; }

      - name: Verify release artifact signatures
        shell: bash
        run: |
          apk_path="build/release/hermes-webui-v${{ steps.release_version.outputs.version_name }}-github.apk"
          aab_path="build/release/hermes-webui-v${{ steps.release_version.outputs.version_name }}.aab"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner" || { echo "Android apksigner is unavailable"; exit 1; }
          "$apksigner" verify --verbose --print-certs "$apk_path"
          jarsigner_output="$(jarsigner -verify "$aab_path" 2>&1)"
          printf '%s\n' "$jarsigner_output"
          printf '%s\n' "$jarsigner_output" | grep -F 'jar verified.' >/dev/null || {
            echo "AAB signature verification failed"
            exit 1
          }

      - name: Set artifact names
        id: artifact_names
        shell: bash
        run: |
          echo "github_apk_artifact_name=hermes-webui-v${{ steps.release_version.outputs.version_name }}-github-apk" >> "$GITHUB_OUTPUT"
          echo "play_aab_artifact_name=hermes-webui-v${{ steps.release_version.outputs.version_name }}-play-aab" >> "$GITHUB_OUTPUT"

      - name: Write manual publish retry details
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Manual Publish Retry Details

          Use these values if one publish target fails after artifact upload:

          - Build run ID: \`${{ github.run_id }}\`
          - Commit SHA: \`${{ steps.release_commit.outputs.commit_sha }}\`
          - Version name: \`${{ steps.release_version.outputs.version_name }}\`
          - Tag name: \`${{ steps.release_version.outputs.tag_name }}\`
          - GitHub APK artifact: \`${{ steps.artifact_names.outputs.github_apk_artifact_name }}\`
          - Play AAB artifact: \`${{ steps.artifact_names.outputs.play_aab_artifact_name }}\`
          EOF

      - name: Upload signed GitHub APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_names.outputs.github_apk_artifact_name }}
          path: |
            build/release/*-github.apk
            build/release/release-notes.md
          if-no-files-found: error

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_names.outputs.play_aab_artifact_name }}
          path: |
            build/release/*.aab
            build/release/play-whatsnew/whatsnew-en-US
          if-no-files-found: error

  publish-github-release:
    name: 2 - Publish GitHub APK
    needs: build-release-artifacts
    uses: ./.github/workflows/2-publish-github-apk.yml
    permissions:
      contents: write
      actions: read
    with:
      artifact_name: ${{ needs.build-release-artifacts.outputs.github_apk_artifact_name }}
      build_run_id: ${{ github.run_id }}
      commit_sha: ${{ needs.build-release-artifacts.outputs.commit_sha }}
      tag_name: ${{ needs.build-release-artifacts.outputs.tag_name }}
      version_name: ${{ needs.build-release-artifacts.outputs.version_name }}

  publish-play-production:
    name: 3 - Publish Play Store Production
    needs: build-release-artifacts
    uses: ./.github/workflows/_publish-play-store.yml
    permissions:
      contents: read
      actions: read
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
    with:
      artifact_name: ${{ needs.build-release-artifacts.outputs.play_aab_artifact_name }}
      build_run_id: ${{ github.run_id }}
      commit_sha: ${{ needs.build-release-artifacts.outputs.commit_sha }}
      tag_name: ${{ needs.build-release-artifacts.outputs.tag_name }}
      version_name: ${{ needs.build-release-artifacts.outputs.version_name }}
      track: production
